name: React Docker CI

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Equivalent to Travis 'before_install'
      # Builds the image using Dockerfile.dev
      - name: Build Development Image
        run: docker build -t kuldeep04/docker-react -f Dockerfile.dev .

      # 3. Equivalent to Travis 'script'
      # Runs the tests inside the newly built Docker container
      - name: Run Tests
        run: docker run -e CI=true kuldeep04/docker-react npm run test -- --coverage